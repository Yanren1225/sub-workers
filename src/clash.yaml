mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: :9090
ipv6: true

profile:
  store-selected: true

geodata-mode: true
geox-url:
  geoip: "https://ghfast.top/github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/geoip-all.dat"
  geosite: "https://ghfast.top/github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/geosite-all.dat"
  mmdb: "https://ghfast.top/github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/Country-all.mmdb"
  asn: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-geodata/Country-ASN.mmdb"

tun:
  enable: true
  stack: mixed
  device: mihomo-tun
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  mtu: 1500
  gso: true
  gso-max-size: 65536
  udp-timeout: 300
  exclude-interface:
    - Tailscale
  # route-exclude-address-set:
  route-exclude-address:
    # Tailscale IP
    - "100.64.0.0/10"
    - fd7a:115c:a1e0::/48
  # inet4_route_address:
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1
  # inet6_route_address:
  #   - '::/1'
  #   - '8000::/1'
dns:
  enable: true
  ipv6: true
  prefer-h3: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  direct-nameserver-follow-policy: true
  default-nameserver:
    - system
    - 119.29.29.29
    - 223.5.5.5
    - 2400:3200::1
    - 2402:4e00:3200::b
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.sb/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - rule-set:yanren-private
    - rule-set:private
    - rule-set:fakeip-filter
  nameserver-policy:
    rule-set:yanren-private: system
    rule-set:private: system

    rule-set:yanren-direct: &cn_dns
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    rule-set:cn: *cn_dns
    rule-set:game-cn: *cn_dns
    rule-set:apple-cn: *cn_dns
    rule-set:microsoft-cn: *cn_dns
    "*.ts.net":
      - 100.100.100.100
    "*.tailscale.net":
      - 100.100.100.100

sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8888]
      active: true
    QUIC:
      ports: [443]
      active: true

proxy-providers:
  SUB:
    type: http
    interval: 86400
    health-check:
      enable: true
      lazy: true
      interval: 1200
      url: https://www.gstatic.com/generate_204
    proxy: DIRECT
    url: "__SUB_URL__"
    path: ./provider_sub.yaml

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - 0.1x_AUTO
      - HK_AUTO
      - JP_AUTO
      - SG_AUTO
      - USA_AUTO
      - MANUAL
      - DIRECT

  - name: AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    lazy: true
    initial: 0
    interval: 1200
    tolerance: 50
    use:
      - SUB

  - name: 0.1x_AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    lazy: true
    initial: 0
    interval: 1200
    tolerance: 50
    use:
      - SUB
    filter: "(?i)0\\.1\\s*x|0\\.1\\s*倍|0\\.1\\s*倍率"

  - name: HK_AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    lazy: true
    initial: 0
    interval: 1200
    tolerance: 50
    use:
      - SUB
    filter: "(?i)香港|HK|Hong Kong"

  - name: JP_AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    lazy: true
    initial: 0
    interval: 1200
    tolerance: 50
    use:
      - SUB
    filter: "(?i)日本|JP|Japan"

  - name: SG_AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    lazy: true
    initial: 0
    interval: 1200
    tolerance: 50
    use:
      - SUB
    filter: "(?i)新加坡|狮城|SG|Singapore"

  - name: USA_AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    lazy: true
    initial: 0
    interval: 1200
    tolerance: 50
    use:
      - SUB
    filter: "(?i)美国|US|United States"

  - name: MANUAL
    type: select
    use:
      - SUB

  - name: BLOCK
    type: select
    proxies:
      - REJECT
      - DIRECT
      - PROXY

  - name: FINAL
    type: select
    proxies:
      - PROXY
      - DIRECT

rules:
  # 自用规则
  - RULE-SET,yanren-private,DIRECT
  - RULE-SET,yanren-private-ip,DIRECT,no-resolve
  - RULE-SET,yanren-reject,BLOCK
  - RULE-SET,yanren-direct,DIRECT
  - RULE-SET,yanren-proxy,PROXY
  # 社区规则
  - RULE-SET,private,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - RULE-SET,game-cn,DIRECT
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,telegram,PROXY
  - RULE-SET,proxy,PROXY
  # GEO IP
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,FINAL

rule-providers:
  yanren-proxy:
    type: http
    behavior: classical
    format: text
    url: https://ghfast.top/github.com/Yanren1225/rules/raw/main/proxy.list
