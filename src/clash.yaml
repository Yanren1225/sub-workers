mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: :9090
ipv6: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-geodata/geoip-all.dat"
  geosite: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-geodata/geosite-all.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-geodata/Country-all.mmdb"
  asn: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-geodata/Country-ASN.mmdb"

tcp-concurrent: true
unified-delay: true
keep-alive-idle: 15
keep-alive-interval: 15

tun:
  enable: true
  stack: mixed
  device: mihomo-tun
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: false
  mtu: 1500
  gso: true
  gso-max-size: 65536
  udp-timeout: 300
  exclude-interface:
    - Tailscale
  # route-exclude-address-set:
  route-exclude-address:
    # Tailscale IP
    - "100.64.0.0/10"
    - fd7a:115c:a1e0::/48
  # inet4_route_address:
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1
  # inet6_route_address:
  #   - '::/1'
  #   - '8000::/1'
dns:
  enable: true
  ipv6: true
  listen: 127.0.0.1:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - system
    - 119.29.29.29
    - 223.5.5.5
    - 2400:3200::1
    - 2402:4e00:3200::b
  nameserver:
    - https://cloudflare-dns.com/dns-query#PROXY
    - https://dns.google/dns-query#PROXY
    - https://dns.sb/dns-query#PROXY
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - rule-set:yanren-private
    - rule-set:private
    - rule-set:fakeip-filter
  nameserver-policy:
    rule-set:yanren-private: system
    rule-set:private: system

    rule-set:yanren-direct: &cn_dns
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    rule-set:cn: *cn_dns
    rule-set:game-cn: *cn_dns
    rule-set:apple-cn: *cn_dns
    rule-set:microsoft-cn: *cn_dns
    rule-set:fakeip-filter: *cn_dns
    "*.ts.net":
      - 100.100.100.100
    "*.tailscale.net":
      - 100.100.100.100

sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8888]
      active: true
    QUIC:
      ports: [443]
      active: true

proxy-providers:
  SUB:
    type: http
    interval: 86400
    health-check:
      enable: true
      lazy: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204
    proxy: DIRECT
    url: "__SUB_URL__"
    path: ./provider_sub.yaml

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - 🌐 AUTO
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇰🇷 KR
      - 🇸🇬 SG
      - 🇲🇾 MY
      - 🇺🇸 USA
      - 🇪🇺 EUR
      - LOW_MULT
      - HIGH_MULT
      - FALLBACK
      - MANUAL
      - DIRECT

  - name: 🌐 AUTO
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB

  # 地区组：一个地区一个 url-test 组，不再区分【优化】/ 普通等线路档位。
  # 地区没有节点时该组会被 build-config 丢弃，并从 PROXY 的引用里一并移除。
  # filter 由 build-config 统一加 i 标志匹配，表达式里不用写 (?i)。

  - name: 🇭🇰 HK
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇭🇰|香港|Hong Kong|(?<![A-Za-z])HK(?![A-Za-z])"

  - name: 🇹🇼 TW
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇹🇼|台湾|臺灣|台北|Taiwan|(?<![A-Za-z])TW(?![A-Za-z])"

  - name: 🇯🇵 JP
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇯🇵|日本|东京|東京|大阪|Tokyo|Osaka|Japan|(?<![A-Za-z])JP(?![A-Za-z])"

  - name: 🇰🇷 KR
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇰🇷|韩国|韓國|首尔|首爾|Seoul|Korea|(?<![A-Za-z])KR(?![A-Za-z])"

  - name: 🇸🇬 SG
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇸🇬|新加坡|狮城|獅城|Singapore|(?<![A-Za-z])SG(?![A-Za-z])"

  - name: 🇲🇾 MY
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇲🇾|马来西亚|馬來西亞|吉隆坡|Malaysia|Kuala Lumpur|(?<![A-Za-z])MY(?![A-Za-z])"

  - name: 🇺🇸 USA
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇺🇸|美国|美國|旧金山|舊金山|洛杉矶|紐約|纽约|西雅图|西雅圖|圣何塞|聖何塞|达拉斯|達拉斯|United States|USA|(?<![A-Za-z])US(?![A-Za-z])"

  - name: 🇪🇺 EUR
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    lazy: true
    interval: 300
    tolerance: 100
    timeout: 3000
    max-failed-times: 3
    use:
      - SUB
    filter: "🇩🇪|🇬🇧|🇫🇷|🇳🇱|🇸🇪|🇨🇭|🇮🇹|🇪🇸|🇵🇱|🇫🇮|🇳🇴|🇩🇰|🇦🇹|🇮🇪|🇧🇪|德国|德國|英国|英國|法国|法國|荷兰|荷蘭|瑞典|瑞士|意大利|西班牙|波兰|波蘭|芬兰|芬蘭|挪威|丹麦|丹麥|奥地利|奧地利|法兰克福|法蘭克福|伦敦|倫敦|巴黎|阿姆斯特丹|Frankfurt|London|Paris|Amsterdam|Germany|United Kingdom|Netherlands|France|Sweden|Switzerland|Italy|Spain|(?<![A-Za-z])DE(?![A-Za-z])|(?<![A-Za-z])UK(?![A-Za-z])|(?<![A-Za-z])NL(?![A-Za-z])"

  - name: LOW_MULT
    type: select
    use:
      - SUB
    filter: "(?i)[×x]\\s*0\\.\\d+|0\\.\\d+\\s*[×x]|0\\.\\d+\\s*倍(?:率)?"

  - name: HIGH_MULT
    type: select
    use:
      - SUB
    filter: "(?i)(?:×\\s*[1-9]\\d*(?:\\.\\d+)?|(?<![A-Za-z0-9])x\\s*[1-9]\\d*(?:\\.\\d+)?|(?<![\\d.])[1-9]\\d*(?:\\.\\d+)?\\s*倍(?:率)?)"

  - name: MANUAL
    type: select
    use:
      - SUB

  - name: FALLBACK
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    interval: 120
    timeout: 3000
    lazy: true
    use:
      - SUB

  - name: BLOCK
    type: select
    proxies:
      - REJECT
      - DIRECT
      - PROXY

  - name: FINAL
    type: select
    proxies:
      - PROXY
      - DIRECT

rules:
  # Google Play：下载 CDN 走国内节点，必须直连（实测直连 8MB/s，走代理 0 速度）；
  # play.googleapis.com / android.clients.google.com 是控制面，必须代理
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,DIRECT
  - DOMAIN-SUFFIX,xn--ngstr-cn-8za9o.com,DIRECT
  - DOMAIN-SUFFIX,play.googleapis.com,PROXY
  - DOMAIN-SUFFIX,android.clients.google.com,PROXY
  # 自用规则
  - RULE-SET,yanren-private,DIRECT
  - RULE-SET,yanren-private-ip,DIRECT,no-resolve
  - RULE-SET,yanren-reject,BLOCK
  - RULE-SET,yanren-direct,DIRECT
  - RULE-SET,yanren-proxy,PROXY
  # 社区规则
  - RULE-SET,private,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - RULE-SET,game-cn,DIRECT
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,telegram,PROXY,no-resolve
  - RULE-SET,proxy,PROXY
  # GEO IP
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,FINAL

rule-providers:
  yanren-proxy:
    type: http
    behavior: classical
    format: text
    url: https://cdn.jsdelivr.net/gh/Yanren1225/rules@main/proxy.list
    path: ./ruleset/yanren-proxy.list
    interval: 3600
  yanren-direct:
    type: http
    behavior: classical
    format: text
    url: https://cdn.jsdelivr.net/gh/Yanren1225/rules@main/direct.list
    path: ./ruleset/yanren-direct.list
    interval: 3600
  yanren-private-ip:
    type: http
    behavior: classical
    format: text
    url: https://cdn.jsdelivr.net/gh/Yanren1225/rules@main/private-ip.list
